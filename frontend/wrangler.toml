name = "mediverse"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# OpenNext for Cloudflare Workers (SSR-capable)
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[vars]
NEXT_PUBLIC_API_URL = "https://api.mediverse.alokkumarsahu.in"
NEXT_PUBLIC_APP_URL = "https://mediverse.alokkumarsahu.in"
NEXT_PUBLIC_APP_NAME = "MediVerse AI"
NODE_ENV = "production"

[placement]
mode = "smart"

routes = [
  { pattern = "mediverse.alokkumarsahu.in", custom_domain = true }
]
