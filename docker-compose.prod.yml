version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mediverse
      POSTGRES_USER: \
      POSTGRES_PASSWORD: \
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  backend:
    image: ghcr.io/alok/mediverse-backend:latest
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - '8000:8000'

volumes:
  postgres_data:
  redis_data:
